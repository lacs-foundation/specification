<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="LACS">
  <title>LACS</title>
  <desc>A specification document with a terminal prompt and risk-level pills — the LACS mark.</desc>

  <defs>
    <linearGradient id="promptGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFB45A"/>
      <stop offset="100%" stop-color="#FF6B1A"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2B3440"/>
      <stop offset="100%" stop-color="#1B232B"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#232D38"/>
      <stop offset="100%" stop-color="#1B232B"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded square plate — same as sysknife -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="#0F1419"/>

  <!-- Document body -->
  <g filter="url(#softShadow)">
    <rect x="60" y="44" width="136" height="168" rx="10" ry="10" fill="url(#docGrad)"/>
    <!-- Page fold corner -->
    <polygon points="164,44 196,44 196,68 164,68" fill="#0F1419" opacity="0.45"/>
    <polyline points="164,44 164,68 196,68" fill="none" stroke="#FF6B1A" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Horizontal rule lines — spec document feel -->
  <line x1="76" y1="80" x2="180" y2="80" stroke="#3A4A58" stroke-width="1.5"/>
  <line x1="76" y1="92" x2="155" y2="92" stroke="#3A4A58" stroke-width="1.5"/>
  <line x1="76" y1="104" x2="168" y2="104" stroke="#3A4A58" stroke-width="1.2"/>

  <!-- Terminal prompt `>` anchored to the doc — the visual bridge to sysknife -->
  <g filter="url(#softShadow)">
    <path d="M 76 122
             L 104 140
             L 76 158
             L 86 158
             L 120 140
             L 86 122 Z"
          fill="url(#promptGrad)"/>
  </g>

  <!-- Cursor block `_` next to prompt -->
  <rect x="126" y="133" width="14" height="11" rx="2" ry="2" fill="#5EEAD4"/>

  <!-- Risk-level pills row — Low / Med / High -->
  <!-- Low pill — muted green -->
  <g filter="url(#pillShadow)">
    <rect x="72" y="176" width="32" height="14" rx="7" ry="7" fill="#1A3A2A"/>
    <rect x="72" y="176" width="32" height="14" rx="7" ry="7" fill="none" stroke="#34C47A" stroke-width="1"/>
    <text x="88" y="186.5" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#34C47A" text-anchor="middle" letter-spacing="0.3">LOW</text>
  </g>
  <!-- Med pill — amber -->
  <g filter="url(#pillShadow)">
    <rect x="110" y="176" width="36" height="14" rx="7" ry="7" fill="#3A2A0A"/>
    <rect x="110" y="176" width="36" height="14" rx="7" ry="7" fill="none" stroke="#FFB45A" stroke-width="1"/>
    <text x="128" y="186.5" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#FFB45A" text-anchor="middle" letter-spacing="0.3">MED</text>
  </g>
  <!-- High pill — signal orange / red -->
  <g filter="url(#pillShadow)">
    <rect x="152" y="176" width="34" height="14" rx="7" ry="7" fill="#3A1A0A"/>
    <rect x="152" y="176" width="34" height="14" rx="7" ry="7" fill="none" stroke="#FF6B1A" stroke-width="1"/>
    <text x="169" y="186.5" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#FF6B1A" text-anchor="middle" letter-spacing="0.3">HIGH</text>
  </g>

  <!-- Subtle bottom bar — same rivet accent pattern as sysknife -->
  <circle cx="56" cy="220" r="5" fill="#FF6B1A" opacity="0.7"/>
  <circle cx="200" cy="220" r="5" fill="#FF6B1A" opacity="0.4"/>
</svg>
